name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # worlds keystone: deterministic (no LLM) — the frontier substrate for
      # world-relative reduction must hold on every worlds.json corpus
      - run: cargo run -p memory-cli --bin eval-worlds
