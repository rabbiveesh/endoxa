[package]
name = "memory-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "mem — the CLI surface: recall/remember, git-derived scopes, on-write consolidation."

[[bin]]
name = "mem"
path = "src/main.rs"

[dependencies]
memory-core = { path = "../memory-core" }
memory-consolidate = { path = "../memory-consolidate" }
memory-embed = { path = "../memory-embed" }
memory-onboard = { path = "../memory-onboard" }
config = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
